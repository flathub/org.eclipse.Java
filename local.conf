<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!--
		Web fonts installed on the host (e.g. by r-cran-gfonts) show up without
		a family name. Skia in WebKitGTK loops forever over such fonts in
		SkFontMgr_fontconfig::GetFamilyNames(), which hangs the WebKitWebProcess
		and the SWT Browser.
	-->
	<selectfont>
		<rejectfont>
			<glob>*.woff</glob>
			<glob>*.woff2</glob>
		</rejectfont>
	</selectfont>
</fontconfig>
